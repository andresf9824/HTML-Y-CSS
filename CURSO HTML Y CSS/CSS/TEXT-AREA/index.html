<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-Area</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form>
        <h2> Formulario de contacto</h2>
        <div class="form_input">
            <label for="nombre">Nombre
            <input type="text" placeholder="Nombre completo" id="nombre">
            </label>
        </div>
        <div class="form_input">
            <label for="email">Email</label>
            <input type="email" placeholder="Email  completo" id="email">
        </div>
        <div class="form_input" >
            <label for="mensaje">Mensaje
            <textarea placeholder="Deja tu mensaje" id="mensaje"> </textarea>
            </label>
        </div> 
        <div class="form_input">
            <label for="terminos">Acepto terminos y condiciones
            <input type="checkbox" id="terminos" class="checkbox">
            </label>
        </div>
    </form>
    
</body>
</html>
