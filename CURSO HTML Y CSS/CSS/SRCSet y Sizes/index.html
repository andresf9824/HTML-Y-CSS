<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRCset & Sizes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <img src="RM.jpg"
    srcset="RM.jpg 700w, dbz.jpg 600w, monteria.jpg 1000w"
    sizes="(max-width: 400px) 300px,
    (max-width: 600px)500px, 900px"> <!--cuando la imagen tenga un ancho menor o igual a 400px, cargame imagenes que tengan 300px -->

    
</body>
</html>
