    EMMET: Plugins que nos facilita la creacion de cosas en html y css.
    Convierte una abrevacion en un codigo.
    . es para las clases
    > indicarle que esta dentro del elemento, por ejemplo: ul>li*3 me crea 3 listas dentro del
    {} indican texto
    ~$ Autoincrementable
    <ul>
        <li></li>
        <li></li>
        <li></li>
    </ul>



    <!-- Con este emmet: header.header>nav.header-nav>ul.header-ul>li.list-item*4>a.link{Link ~$} Creo lo que se ve abajo. -->

    <header class="header">
        <nav class="header-nav">
            <ul class="header-ul">
                <li class="list-item"><a href="https://www.youtube.com/?app=desktop&hl=es" class="link">YouTube</a></li>
                <li class="list-item"><a href="https://www.google.com/" class="link">Google</a></li>
            </ul>
        </nav>
    </header>
