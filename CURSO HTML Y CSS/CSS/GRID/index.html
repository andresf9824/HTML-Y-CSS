<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- GRID: Cuando quiero trabajar en dos ejes; filas y columnas. 
     FLEXBOX: cuando trabajo en una sola direccion, ya sea filas o columnas-->

     <!-- Grid container (contenedor padre)
      grid item, son los hijos, los elementos uqe están dentro de ese contenedor padre 
      las lineas, son los bordes, separan las cuadriculas -->

      <div class="grid">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
        <div class="grid-item">4</div>
        <div class="grid-item">5</div>
        <div class="grid-item">6</div>
      </div>
    
</body>
</html>
